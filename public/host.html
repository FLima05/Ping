<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ping, host</title>
    <link rel="stylesheet" href="/css/host.css" />
  </head>
  <body>
    <header class="barra">
      <span id="numero">Sala aberta</span>
      <span id="conexao"></span>
    </header>

    <main id="palco">
      <section id="abertura">
        <div id="qr-bloco">
          <img id="qr" src="/qr.svg" alt="QR code para entrar na partida" />
          <p id="url-play"></p>
        </div>

        <div id="config">
          <h2>Tema</h2>
          <ul id="temas" class="temas"></ul>

          <h2>Modo</h2>
          <div id="modos" class="modos">
            <button type="button" class="tema" data-modo="individual">Individual</button>
            <button type="button" class="tema" data-modo="equipes" data-quantidade="2">2 equipes</button>
            <button type="button" class="tema" data-modo="equipes" data-quantidade="3">3 equipes</button>
            <button type="button" class="tema" data-modo="equipes" data-quantidade="4">4 equipes</button>
          </div>

          <h2 id="titulo-lobby">Na sala: 0</h2>
          <button type="button" id="sortear" class="tema" hidden>Sortear equipes</button>
          <ul id="lobby" class="lobby"></ul>
        </div>
      </section>

      <section id="rodada" hidden>
        <p id="dobro" hidden>Esta pergunta vale o dobro</p>
        <h1 id="enunciado"></h1>
        <ol id="alternativas" class="alternativas"></ol>
        <p id="rapido"></p>
      </section>

      <section id="secao-placar" hidden>
        <ol id="placar-equipes" class="equipes" hidden></ol>
        <h2>Top 3</h2>
        <ol id="placar" class="placar"></ol>
        <a id="relatorio" class="relatorio" href="/relatorio.csv" hidden>Baixar relatório da partida</a>
      </section>
    </main>

    <footer class="barra rodape">
      <span id="contador">0 de 0 responderam</span>
      <button id="avancar" class="botao">Iniciar</button>
    </footer>

    <script src="/js/host.js"></script>
  </body>
</html>
