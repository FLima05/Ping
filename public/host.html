<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ping · Host</title>
    <link rel="stylesheet" href="/css/host.css" />
    <style>
      @keyframes flutuadinha {
        0% { transform: translateY(0px) rotate(-3deg) scale(1); }
        50% { transform: translateY(-8px) rotate(3deg) scale(1.05); }
        100% { transform: translateY(0px) rotate(-3deg) scale(1); }
      }
      .cracha-animado {
        animation: flutuadinha 3s ease-in-out infinite;
        display: inline-block;
      }

      /* Estilos do Pódio Estilo Kahoot */
      #container-podio {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        gap: 1.5rem;
        height: 280px;
        margin-bottom: 2rem;
        padding-top: 2rem;
      }
      .bloco-podio {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        border-radius: 12px 12px 0 0;
        font-weight: bold;
        color: #111;
        box-shadow: 0 -4px 15px rgba(0,0,0,0.3);
        transition: height 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        padding-bottom: 1rem;
      }
      .podio-1 { background-color: #ffd700; height: 220px; width: 140px; z-index: 3; }
      .podio-2 { background-color: #c0c0c0; height: 160px; width: 130px; z-index: 2; }
      .podio-3 { background-color: #cd7f32; height: 120px; width: 130px; z-index: 1; }
      
      .avatar-podio { font-size: 2.5rem; margin-bottom: 0.5rem; }
      .nome-podio { font-size: 1.1rem; max-width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .pontos-podio { font-size: 0.9rem; opacity: 0.8; margin-top: 0.2rem; }
    </style>
  </head>
  <body>
    <header class="barra">
      <span id="numero">Sala aberta</span>
      <span id="conexao"></span>
    </header>

    <main id="palco">
      <!-- TELA DE ABERTURA -->
      <section id="abertura" style="display: flex; gap: 2rem; width: 100%;">
        
        <!-- COLUNA ESQUERDA: QR Code + Temas em Lista -->
        <div style="flex: 1; display: flex; flex-direction: column; gap: 1.5rem; align-items: center;">
          <div id="qr-bloco" style="text-align: center;">
            <img id="qr" src="/qr.svg" alt="QR code para entrar na partida" style="max-width: 220px; background: white; padding: 10px; border-radius: 10px;"/>
            <p id="url-play" style="font-weight: bold; margin-top: 0.5rem;"></p>
          </div>
          
          <div id="tema-bloco" style="width: 100%; max-width: 400px;">
            <h2 style="text-align: center; margin-bottom: 1rem;">Escolha o tema</h2>
            <!-- Lista vertical de temas -->
            <ul id="temas" class="temas" style="display: flex; flex-direction: column; gap: 0.75rem; list-style: none; padding: 0; width: 100%;"></ul>
          </div>
        </div>

        <!-- COLUNA DIREITA: Arquibancada -->
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem;">
          <h2 style="text-align: center; margin-bottom: 2rem;">Jogadores na Sala</h2>
          <div id="arquibancada" style="display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; align-items: center; width: 100%;"></div>
        </div>
      </section>

      <!-- TELA DA PERGUNTA -->
      <section id="rodada" hidden>
        <div id="container-tempo" style="position: relative; width: 100%; height: 35px; background-color: #333; border-radius: 8px; overflow: hidden; margin-bottom: 1.5rem; display: none;">
          <div id="barra-tempo" style="position: absolute; top: 0; left: 0; height: 100%; width: 100%; background-color: #5bc0de; transition: width 0.05s linear, background-color 0.3s;"></div>
          <div id="texto-tempo" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; z-index: 2; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); font-size: 1.1rem;"></div>
        </div>

        <h1 id="enunciado"></h1>
        <div id="aviso-suspense" style="text-align: center; color: #888; font-style: italic; margin: 2rem 0; font-size: 1.2rem;">Lendo a pergunta... 🤫</div>
        <ol id="alternativas" class="alternativas"></ol>
      </section>

      <!-- TELA DE PLACAR / PÓDIO -->
      <section id="secao-placar" hidden>
        <h2 id="titulo-secao-placar">Placar</h2>
        <div id="container-podio" style="display: none;"></div>
        <ol id="placar" class="placar"></ol>
      </section>
    </main>

    <footer class="barra rodape">
      <span id="contador">0 de 0 responderam</span>
      <button id="avancar" class="botao">Iniciar</button>
    </footer>

    <script src="/js/host.js"></script>
  </body>
</html>
