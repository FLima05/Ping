<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0d0d" />
    <title>Ping</title>
    <link rel="stylesheet" href="/css/play.css" />
  </head>
  <body>
    <section id="entrada">
      <p id="marca">Ping</p>
      <h1>Seu nome</h1>
      <input
        id="nome"
        maxlength="20"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="words"
        spellcheck="false"
        enterkeyhint="go"
      />
      <button id="entrar" class="botao">Entrar</button>
    </section>

    <section id="jogo" hidden>
      <p id="aviso">Aguarde o início</p>
      <div id="alternativas" class="botoes"></div>
      <footer id="rodape">
        <span id="posicao"></span>
        <span id="pontos"></span>
        <span id="conexao"></span>
      </footer>
    </section>

    <script src="/js/play.js"></script>
  </body>
</html>
