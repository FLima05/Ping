<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0d0d" />
    <title>Ping</title>
    <link rel="icon" type="image/svg+xml" href="/img/ping-logo.svg" />
    <link rel="icon" type="image/png" href="/img/ping-logo.png" />
    <link rel="apple-touch-icon" href="/img/ping-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/play.css" />
  </head>
  <body>
    <section id="entrada">
      <div class="entrada-card">
        <img id="marca" class="logo" src="/img/ping-logo.png" alt="Ping" />
        <p class="subtitulo">Digite seu nome pra entrar na sala</p>
        <label for="nome" class="rotulo-nome">Seu nome</label>
        <input
          id="nome"
          maxlength="20"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="words"
          spellcheck="false"
          enterkeyhint="go"
          placeholder="Ex: Ana"
        />
        <p class="rotulo-nome">Seu avatar</p>
        <div id="avatares" class="avatares"></div>
        <p id="aviso-sala" class="aviso-sala" hidden>A sala ainda não foi criada, aguardando o professor…</p>
        <button id="entrar" class="botao">Entrar</button>
      </div>
    </section>

    <section id="jogo" hidden>
      <p id="aviso">Aguarde o início</p>
      <div id="alternativas" class="botoes"></div>
      <div id="aposta" class="aposta" hidden>
        <label for="aposta-slider">Apostar <span id="aposta-valor">0%</span> dos pontos</label>
        <input type="range" id="aposta-slider" min="0" max="100" step="10" value="0" />
      </div>
      <div id="reacoes-jogador" class="reacoes-jogador"></div>
      <footer id="rodape" class="rodape-jogo">
        <span id="posicao"></span>
        <span id="pontos"></span>
        <span id="conexao"></span>
      </footer>
    </section>

    <script src="/js/play.js"></script>
  </body>
</html>
